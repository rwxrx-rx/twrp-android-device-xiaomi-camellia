name: Build OrangeFox Recovery

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Branch (Pilih Angkanya Saja: 12.1 / 11.0)'
        required: true
        default: '12.1'
        type: choice
        options:
          - '12.1'
          - '11.0'
          - '9.0'
      DEVICE_TREE_URL:
        description: 'Device Tree Repository URL'
        required: true
        default: 'https://github.com/rwxrx-rx/twrp-android-device-xiaomi-camellia'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'fox_12.1'
      DEVICE_PATH:
        description: 'Device Tree Path'
        required: true
        default: 'device/xiaomi/camellia'
      DEVICE_NAME:
        description: 'Device Codename'
        required: true
        default: 'camellia'
      MAKEFILE_NAME:
        description: 'Makefile Prefix (twrp / omni)'
        required: true
        default: 'twrp'
        type: choice
        options:
          - twrp
          - omni
      BUILD_TARGET:
        description: 'Build Target'
        required: true
        default: 'bootimage'
        type: choice
        options:
          - recoveryimage
          - bootimage
          - vendor_bootimage

jobs:
  build:
    name: Build OFOX by ${{ github.actor }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Update & Install Dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        echo "https://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
        sudo apt-get update -y
        sudo apt-get install -y tzdata
        sudo apt-get install -y --no-install-recommends git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig rsync python2 python3 python-is-python3

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Set-up Manifest & Sync
      run: |
        mkdir -p ${{ github.workspace }}/OrangeFox
        git config --global user.name "Samuel Kendall"
        git config --global user.email "kinguser981@gmail.com"
        git clone https://gitlab.com/OrangeFox/sync.git
        cd sync
        
        # Eksekusi sinkronisasi
        ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path ${{ github.workspace }}/OrangeFox

    - name: Clone Device Tree
      run: |
        # Langsung masuk ke folder OrangeFox utama
        cd ${{ github.workspace }}/OrangeFox
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ${{ github.event.inputs.DEVICE_PATH }}

    - name: Build OrangeFox
      run: |
        # Eksekusi Build di folder OrangeFox
        cd ${{ github.workspace }}/OrangeFox
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL="C"
        lunch ${{ github.event.inputs.MAKEFILE_NAME }}_${{ github.event.inputs.DEVICE_NAME }}-eng
        mka adbd ${{ github.event.inputs.BUILD_TARGET }}

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-${{ github.event.inputs.DEVICE_NAME }}
        path: |
          ${{ github.workspace }}/OrangeFox/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox*.zip
          ${{ github.workspace }}/OrangeFox/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox*.img
